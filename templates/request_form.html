{% extends 'base.html' %}{% block title %}Request {{ person.name }}{% endblock %}{% block content %}<section class="section-pad"><div class="container form-container"><a class="back-link" href="{{ url_for('freelancer',uid=person.id) }}"><i class="bi bi-arrow-left"></i> {{ person.name }}’s profile</a><div class="eyebrow mt-4">Start a conversation</div><h1>Request a project</h1><p class="muted">Your request will go directly to {{ person.name }}.</p><form method="post" class="content-card mt-4"><label class="form-label">Project title</label><input name="title" class="form-control mb-3" required placeholder="What do you need help with?"><label class="form-label">Description</label><textarea name="description" class="form-control mb-3" required rows="5" placeholder="Share a little context, scope, and your goals"></textarea><div class="row"><div class="col-md-6"><label class="form-label">Budget (₹)</label><input name="budget" type="number" min="0" class="form-control mb-3" placeholder="Optional"></div><div class="col-md-6"><label class="form-label">Target deadline</label><input name="deadline" type="date" class="form-control mb-3"></div></div><label class="form-label">Relevant skills</label><div class="skill-checks">{% for s in person.profile.skills %}<label><input type="checkbox" name="skills" value="{{ s.id }}"> {{ s.name }}</label>{% endfor %}</div><button class="btn btn-dark btn-lg mt-4">Send project request <i class="bi bi-send"></i></button></form></div></section>{% endblock %}
