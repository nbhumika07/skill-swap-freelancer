{% extends 'base.html' %}{% block title %}Account settings{% endblock %}{% block content %}<section class="section-pad"><div class="container form-container"><a class="back-link" href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left"></i> Dashboard</a><div class="eyebrow mt-4">Your account</div><h1>Profile settings</h1><p class="muted">Keep your information accurate and current.</p><form method="post" class="content-card mt-4"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required>{% if current_user.role=='freelancer' %}{% set p=current_user.profile %}<label class="form-label">Professional title</label><input class="form-control mb-3" name="title" value="{{ p.title }}"><label class="form-label">About you</label><textarea class="form-control mb-3" rows="5" name="bio">{{ p.bio }}</textarea><div class="row"><div class="col-md-6"><label class="form-label">Location</label><input class="form-control mb-3" name="location" value="{{ p.location }}"></div><div class="col-md-6"><label class="form-label">Experience</label><select class="form-select mb-3" name="experience">{% for e in ['Beginner','Intermediate','Advanced'] %}<option {{ 'selected' if p.experience==e }}>{{ e }}</option>{% endfor %}</select></div></div><label class="form-label">Hourly rate (₹)</label><input class="form-control mb-3" type="number" min="0" name="hourly_rate" value="{{ p.hourly_rate }}"><label class="form-check-label mb-4"><input type="checkbox" class="form-check-input me-2" name="available" {{ 'checked' if p.available }}>Available for new projects</label><br>{% endif %}<button class="btn btn-dark">Save changes <i class="bi bi-check2"></i></button></form></div></section>{% endblock %}
